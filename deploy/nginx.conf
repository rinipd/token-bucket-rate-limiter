# upstream: the pool of app instances nginx load-balances across. With no
# explicit balancing method directive, nginx defaults to round-robin: each
# new connection is sent to the next server in the list, in turn. That's
# exactly what makes one client's consecutive requests land on DIFFERENT app
# instances — request 1 to app1, request 2 to app2, request 3 to app3,
# request 4 back to app1, and so on.
#
# This is deliberate: an in-memory, per-process rate limiter would never see
# more than roughly a third of any one client's traffic (whichever third
# happened to land on it), so it would let far more requests through in
# total than the configured limit — each instance enforcing its own
# independent burst. Routing through this round-robin upstream is what
# exercises — and proves — that the Redis-backed limiter enforces ONE
# shared limit across all three instances instead of one limit per instance.
upstream app_servers {
    server app1:8080;
    server app2:8080;
    server app3:8080;
}

server {
    listen 80;

    # Docker's embedded DNS server, always at 127.0.0.11 inside a container.
    # Using it + a variable upstream makes nginx resolve app hostnames at
    # request time instead of refusing to start if one isn't resolvable yet.
    resolver 127.0.0.11 valid=10s;

    location / {
        set $upstream http://app_servers;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
