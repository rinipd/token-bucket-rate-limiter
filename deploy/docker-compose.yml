services:
  redis:
    image: redis:7-alpine
    networks:
      - ratelimit-net
    # Not published to the host: only the app instances, over the shared
    # network below, need to reach Redis. Uncomment to inspect it from the
    # host (e.g. with redis-cli) while debugging.
    # ports:
    #   - "6379:6379"

  # app1/app2/app3 are three identical instances of the same image, all in
  # redis backend mode and all pointed at the same Redis — this is what lets
  # them share one global rate-limit state instead of each keeping its own.
  # None of them publish a port to the host: the only way in from outside
  # this compose network is through nginx below, so every request genuinely
  # gets load-balanced instead of one instance being reachable directly.
  app1:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      BACKEND: redis
      # "redis" resolves via Docker Compose's internal DNS to the redis
      # service above — service names in a compose file are hostnames on the
      # shared network, so no hardcoded IP or extra config is needed.
      REDIS_ADDR: redis:6379
      ADDR: ":8080"
    depends_on:
      - redis
    networks:
      - ratelimit-net

  app2:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      BACKEND: redis
      REDIS_ADDR: redis:6379
      ADDR: ":8080"
    depends_on:
      - redis
    networks:
      - ratelimit-net

  app3:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      BACKEND: redis
      REDIS_ADDR: redis:6379
      ADDR: ":8080"
    depends_on:
      - redis
    networks:
      - ratelimit-net

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - app1
      - app2
      - app3
    networks:
      - ratelimit-net

networks:
  # A shared network so services resolve each other by name (redis, app1,
  # app2, app3, nginx) instead of needing hardcoded container IPs.
  ratelimit-net:
    driver: bridge
